// dot-server post-startup configuration.
//
// Executed AFTER the listener opens, so startup-only variables are already
// locked. Put things here that assume a running server: aliases, log levels,
// loading the first game.
//
// Runs before +command arguments from the command line, so anything passed as
// `+hostname "Something"` still wins.

// Quieter than the default INFO for routine operation; raise per channel when
// something needs watching:
//   log_level net debug
// log_level info

// Handy aliases. `alias` takes a quoted command string; semicolons separate
// several commands.
alias "who" "status"
alias "reload_admins" "admin_reload"

// Load the first game. Uncomment and name a game_id configured on the
// DotGameManager:
// changelevel dm_arena
