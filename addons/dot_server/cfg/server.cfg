// dot-server startup configuration.
//
// Executed BEFORE the listener opens, which is why startup-only variables
// (sv_tickrate, the port) can be set here and nowhere else. Copy this to
// user://cfg/server.cfg and edit that — the copy in the addon is a default and
// will be replaced when the addon is updated.
//
// Search order is user://cfg, then res://cfg, then this directory. The first
// match wins, so your copy shadows this one.

// ---------------------------------------------------------------- Identity

hostname "A dot server"

// ----------------------------------------------------------------- Players

sv_maxplayers 32

// Slots held for players with the "reservation" admin flag. Counted inside
// sv_maxplayers, so 32 slots with 2 reserved fills up for the public at 30.
sv_reserved_slots 0

// Join password. Leave empty for a public server.
sv_password ""

// Most simultaneous connections from one address. 0 for no limit.
//
// Off by default because an address is not a person: a household, a university
// and everybody behind CGNAT are each one address, so a small number here
// refuses legitimate players with no way for them to tell why. Turn it on when
// one machine holding half the slots is a problem you actually have. Loopback
// is never limited, so this cannot lock an operator out of their own server.
sv_max_connections_per_ip 0

// -------------------------------------------------------------- Simulation

// Cannot be changed once the server is running.
sv_tickrate 60

// Seconds of silence before a connected player is dropped.
sv_timeout 60

// ------------------------------------------------------------------- Query

// Answer the dot query protocol, so server browsers and trackers can see this
// server. Safe on: every UDP query is challenged against the source address
// before any payload is built, and rate limited per address.
sv_query 1

// Also answer A2S. Off by default. Turn it on to appear in the twenty years of
// trackers, chat bots and uptime monitors that speak nothing else —
// it publishes the same facts in a worse format, and always to anyone who asks.
sv_a2s 0

// How much of the player list a query may see: full, names, count or none.
// Never includes an account identifier at any setting.
sv_query_players full

// ------------------------------------------------------------------ Cheats

// Gates every cheat-flagged variable. Leave off on a live server.
sv_cheats 0

// ------------------------------------------------------------------- Notes
//
// RCON is configured through DotServerConfig rather than here, because an
// rcon_password in a config file is a password in a file that gets copied
// around, pasted into issues, and committed by accident. Set it through the
// environment (DOT_SERVER_RCON_PASSWORD) or a config JSON with restricted
// permissions.
//
// Empty rcon_password means the RCON listener does not open at all. There is no
// setting that produces an unauthenticated remote console.
